<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Seite nicht gefunden — BDITEC" />
    <title>404 — BDITEC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1220;
        --text: #f4f7fb;
        --muted: #a8b3c7;
        --accent: #e85d8a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: Poppins, system-ui, sans-serif;
        background:
          radial-gradient(ellipse at 20% 0%, #1a2744 0%, transparent 55%),
          radial-gradient(ellipse at 80% 100%, #2a1530 0%, transparent 50%),
          var(--bg);
        color: var(--text);
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        letter-spacing: -0.03em;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        max-width: 28rem;
      }
      a {
        display: inline-block;
        padding: 0.85rem 1.4rem;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        filter: brightness(1.08);
      }
    </style>
  </head>
  <body>
    <a href="#main" style="position:absolute;left:-999px;top:auto;width:1px;height:1px;overflow:hidden">Zum Inhalt</a>
    <main id="main">
      <p style="letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.75rem">BDITEC</p>
      <h1>404</h1>
      <p>Diese Seite gibt es nicht. Zurück zur Startseite und online bestellen.</p>
      <a href="/">Zur Startseite</a>
      <p style="margin-top: 1.25rem"><a href="/shop.html" style="background: transparent; border: 1px solid rgba(255,255,255,0.35)">Zum Shop</a></p>
    </main>
    <script>
      window.va =
        window.va ||
        function () {
          ;(window.vaq = window.vaq || []).push(arguments)
        }
      window.va('event', {
        name: 'page_404',
        data: { path: location.pathname.slice(0, 120) },
      })
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
