<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title">
  <title id="title">Digital Marketing</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120e1c"/>
      <stop offset="55%" stop-color="#1a0f3a"/>
      <stop offset="100%" stop-color="#3b00c5"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#221833"/>
      <stop offset="100%" stop-color="#14101f"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#26a4b0"/>
      <stop offset="100%" stop-color="#ff018f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <circle cx="160" cy="120" r="160" fill="#ff018f" opacity="0.12"/>
  <circle cx="1140" cy="700" r="200" fill="#26a4b0" opacity="0.12"/>

  <!-- Main analytics dashboard -->
  <g filter="url(#soft)" transform="translate(80 100)">
    <rect width="740" height="600" rx="20" fill="url(#panel)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <text x="36" y="48" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="700">Campaign Analytics</text>
    <text x="36" y="76" fill="rgba(255,255,255,0.45)" font-family="Poppins, Arial, sans-serif" font-size="14">Last 30 days · All channels</text>
    <rect x="560" y="28" width="150" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <text x="635" y="52" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Poppins, Arial, sans-serif" font-size="13">Export CSV</text>

    <!-- KPI cards -->
    <g transform="translate(36 104)">
      <rect width="200" height="96" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <text x="20" y="32" fill="rgba(255,255,255,0.5)" font-family="Poppins, Arial, sans-serif" font-size="12">Impressions</text>
      <text x="20" y="66" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="700">1.28M</text>
      <text x="140" y="66" fill="#26a4b0" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="600">+18%</text>

      <rect x="220" width="200" height="96" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <text x="240" y="32" fill="rgba(255,255,255,0.5)" font-family="Poppins, Arial, sans-serif" font-size="12">Conversions</text>
      <text x="240" y="66" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="700">4,820</text>
      <text x="360" y="66" fill="#f8e937" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="600">+12%</text>

      <rect x="440" width="220" height="96" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <text x="460" y="32" fill="rgba(255,255,255,0.5)" font-family="Poppins, Arial, sans-serif" font-size="12">ROAS</text>
      <text x="460" y="66" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="700">4.6×</text>
      <text x="580" y="66" fill="#ff018f" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="600">+0.4</text>
    </g>

    <!-- Chart area -->
    <g transform="translate(36 230)">
      <rect width="668" height="320" rx="16" fill="rgba(0,0,0,0.25)" stroke="rgba(255,255,255,0.06)"/>
      <!-- gridlines -->
      <path d="M40 60H640M40 120H640M40 180H640M40 240H640" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <!-- bars -->
      <rect x="70" y="200" width="36" height="80" rx="6" fill="#5b2ef5" opacity="0.85"/>
      <rect x="130" y="160" width="36" height="120" rx="6" fill="#5b2ef5" opacity="0.85"/>
      <rect x="190" y="130" width="36" height="150" rx="6" fill="#26a4b0" opacity="0.9"/>
      <rect x="250" y="100" width="36" height="180" rx="6" fill="#26a4b0" opacity="0.9"/>
      <rect x="310" y="140" width="36" height="140" rx="6" fill="#5b2ef5" opacity="0.85"/>
      <rect x="370" y="80" width="36" height="200" rx="6" fill="#ff018f" opacity="0.9"/>
      <rect x="430" y="60" width="36" height="220" rx="6" fill="#ff018f" opacity="0.9"/>
      <rect x="490" y="90" width="36" height="190" rx="6" fill="#26a4b0" opacity="0.9"/>
      <rect x="550" y="40" width="36" height="240" rx="6" fill="#f8e937" opacity="0.9"/>
      <!-- trend line -->
      <path d="M88 210 C140 170, 200 140, 260 110 S380 90, 448 70 S540 80, 568 50" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="568" cy="50" r="7" fill="#f8e937" stroke="#fff" stroke-width="2"/>
      <text x="40" y="310" fill="rgba(255,255,255,0.35)" font-family="Poppins, Arial, sans-serif" font-size="11">Week 1</text>
      <text x="300" y="310" fill="rgba(255,255,255,0.35)" font-family="Poppins, Arial, sans-serif" font-size="11">Week 3</text>
      <text x="560" y="310" fill="rgba(255,255,255,0.35)" font-family="Poppins, Arial, sans-serif" font-size="11">Week 5</text>
    </g>
  </g>

  <!-- Channel cards -->
  <g filter="url(#soft)" transform="translate(860 120)">
    <rect width="340" height="120" rx="16" fill="#ff018f"/>
    <text x="28" y="42" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="13" letter-spacing="1.5">SEO</text>
    <text x="28" y="74" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="26" font-weight="700">+ Rankings</text>
    <text x="28" y="100" fill="rgba(255,255,255,0.8)" font-family="Poppins, Arial, sans-serif" font-size="13">Technical · Content · Local</text>
  </g>
  <g filter="url(#soft)" transform="translate(860 270)">
    <rect width="340" height="120" rx="16" fill="#26a4b0"/>
    <text x="28" y="42" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="13" letter-spacing="1.5">PPC / SEM</text>
    <text x="28" y="74" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="26" font-weight="700">+ Conversions</text>
    <text x="28" y="100" fill="rgba(255,255,255,0.8)" font-family="Poppins, Arial, sans-serif" font-size="13">Google · Meta · Retargeting</text>
  </g>
  <g filter="url(#soft)" transform="translate(860 420)">
    <rect width="340" height="120" rx="16" fill="#5b2ef5"/>
    <text x="28" y="42" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="13" letter-spacing="1.5">SOCIAL</text>
    <text x="28" y="74" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="26" font-weight="700">+ Reach</text>
    <text x="28" y="100" fill="rgba(255,255,255,0.8)" font-family="Poppins, Arial, sans-serif" font-size="13">Organic · Ads · Creators</text>
  </g>
  <g filter="url(#soft)" transform="translate(860 570)">
    <rect width="340" height="110" rx="16" fill="#171023" stroke="rgba(248,233,55,0.45)"/>
    <text x="28" y="42" fill="#f8e937" font-family="Poppins, Arial, sans-serif" font-size="13" letter-spacing="1.5">EMAIL · ASO</text>
    <text x="28" y="74" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="700">Lifecycle growth</text>
    <text x="28" y="98" fill="rgba(255,255,255,0.55)" font-family="Poppins, Arial, sans-serif" font-size="13">Flows · Segments · Store listing</text>
  </g>
</svg>
