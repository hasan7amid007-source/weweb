<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title">
  <title id="title">E-Commerce</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120e1c"/>
      <stop offset="55%" stop-color="#1a0f3a"/>
      <stop offset="100%" stop-color="#3b00c5"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241b38"/>
      <stop offset="100%" stop-color="#14101f"/>
    </linearGradient>
    <linearGradient id="prod1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6a3dff"/>
      <stop offset="100%" stop-color="#3b00c5"/>
    </linearGradient>
    <linearGradient id="prod2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fd0dc"/>
      <stop offset="100%" stop-color="#1b8a94"/>
    </linearGradient>
    <linearGradient id="prod3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4fb0"/>
      <stop offset="100%" stop-color="#c90070"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <circle cx="1100" cy="140" r="180" fill="#26a4b0" opacity="0.12"/>
  <circle cx="140" cy="700" r="200" fill="#ff018f" opacity="0.1"/>

  <!-- Storefront header -->
  <g filter="url(#soft)" transform="translate(100 90)">
    <rect width="1080" height="72" rx="16" fill="#171023" stroke="rgba(255,255,255,0.1)"/>
    <text x="32" y="44" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="700">BDITEC Store</text>
    <rect x="280" y="18" width="420" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)"/>
    <text x="304" y="42" fill="rgba(255,255,255,0.4)" font-family="Poppins, Arial, sans-serif" font-size="14">Search products…</text>
    <rect x="740" y="18" width="110" height="36" rx="10" fill="rgba(255,255,255,0.06)"/>
    <text x="795" y="42" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Poppins, Arial, sans-serif" font-size="13">Catalog</text>
    <rect x="868" y="18" width="120" height="36" rx="10" fill="#ff018f"/>
    <text x="928" y="42" text-anchor="middle" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="600">Cart (3)</text>
    <circle cx="1036" cy="36" r="18" fill="#5b2ef5"/>
    <circle cx="1036" cy="32" r="7" fill="#fff" opacity="0.9"/>
    <ellipse cx="1036" cy="46" rx="10" ry="6" fill="#fff" opacity="0.9"/>
  </g>

  <!-- Product cards -->
  <g filter="url(#soft)" transform="translate(100 200)">
    <rect width="300" height="420" rx="18" fill="url(#card)" stroke="rgba(255,255,255,0.1)"/>
    <rect x="20" y="20" width="260" height="200" rx="14" fill="url(#prod1)"/>
    <circle cx="150" cy="120" r="48" fill="rgba(255,255,255,0.15)"/>
    <rect x="110" y="95" width="80" height="50" rx="8" fill="rgba(255,255,255,0.25)"/>
    <rect x="20" y="244" width="160" height="14" rx="7" fill="rgba(255,255,255,0.75)"/>
    <rect x="20" y="272" width="120" height="10" rx="5" fill="rgba(255,255,255,0.25)"/>
    <text x="20" y="322" fill="#f8e937" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700">€129</text>
    <rect x="20" y="350" width="140" height="40" rx="12" fill="#ff018f"/>
    <text x="90" y="376" text-anchor="middle" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="600">Add to cart</text>
    <rect x="176" y="350" width="104" height="40" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)"/>
    <text x="228" y="376" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Poppins, Arial, sans-serif" font-size="13">Details</text>
  </g>

  <g filter="url(#soft)" transform="translate(440 180)">
    <rect width="320" height="460" rx="18" fill="url(#card)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
    <path d="M16 0h72v16c0 6.6-5.4 12-12 12H16V0z" fill="#f8e937"/>
    <text x="52" y="19" text-anchor="middle" fill="#171023" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="700">BEST</text>
    <rect x="22" y="40" width="276" height="220" rx="14" fill="url(#prod2)"/>
    <path d="M110 120h100v80H110z" fill="rgba(255,255,255,0.2)"/>
    <circle cx="160" cy="150" r="28" fill="rgba(255,255,255,0.3)"/>
    <rect x="22" y="288" width="180" height="14" rx="7" fill="rgba(255,255,255,0.8)"/>
    <rect x="22" y="316" width="140" height="10" rx="5" fill="rgba(255,255,255,0.25)"/>
    <g transform="translate(22 348)">
      <circle cx="8" cy="8" r="5" fill="#f8e937"/>
      <circle cx="24" cy="8" r="5" fill="#f8e937"/>
      <circle cx="40" cy="8" r="5" fill="#f8e937"/>
      <circle cx="56" cy="8" r="5" fill="#f8e937"/>
      <circle cx="72" cy="8" r="5" fill="rgba(255,255,255,0.25)"/>
      <text x="92" y="12" fill="rgba(255,255,255,0.5)" font-family="Poppins, Arial, sans-serif" font-size="12">4.8 · 214 reviews</text>
    </g>
    <text x="22" y="400" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="700">€249</text>
    <rect x="22" y="420" width="276" height="44" rx="12" fill="#26a4b0"/>
    <text x="160" y="448" text-anchor="middle" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="15" font-weight="700">Buy now</text>
  </g>

  <g filter="url(#soft)" transform="translate(800 200)">
    <rect width="300" height="420" rx="18" fill="url(#card)" stroke="rgba(255,255,255,0.1)"/>
    <rect x="20" y="20" width="260" height="200" rx="14" fill="url(#prod3)"/>
    <rect x="90" y="70" width="120" height="100" rx="12" fill="rgba(255,255,255,0.18)"/>
    <rect x="20" y="244" width="170" height="14" rx="7" fill="rgba(255,255,255,0.75)"/>
    <rect x="20" y="272" width="130" height="10" rx="5" fill="rgba(255,255,255,0.25)"/>
    <text x="20" y="322" fill="#f8e937" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700">€89</text>
    <rect x="20" y="350" width="260" height="40" rx="12" fill="#5b2ef5"/>
    <text x="150" y="376" text-anchor="middle" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="600">Add to cart</text>
  </g>

  <!-- Checkout toast -->
  <g filter="url(#soft)" transform="translate(920 640)">
    <rect width="260" height="70" rx="14" fill="#171023" stroke="rgba(38,164,176,0.5)"/>
    <circle cx="36" cy="35" r="16" fill="#26a4b0"/>
    <path d="M28 35l6 6 12-12" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="64" y="30" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="600">Checkout secured</text>
    <text x="64" y="50" fill="rgba(255,255,255,0.5)" font-family="Poppins, Arial, sans-serif" font-size="12">Stripe · PayPal · Invoice</text>
  </g>
</svg>
