<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title">
  <title id="title">Offline Marketing</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120e1c"/>
      <stop offset="55%" stop-color="#1a0f3a"/>
      <stop offset="100%" stop-color="#3b00c5"/>
    </linearGradient>
    <linearGradient id="billboard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6a3dff"/>
      <stop offset="50%" stop-color="#5b2ef5"/>
      <stop offset="100%" stop-color="#3b00c5"/>
    </linearGradient>
    <linearGradient id="poster" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4fb0"/>
      <stop offset="100%" stop-color="#c90070"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <circle cx="160" cy="160" r="170" fill="#26a4b0" opacity="0.12"/>
  <circle cx="1140" cy="680" r="200" fill="#ff018f" opacity="0.1"/>

  <!-- Billboard -->
  <g filter="url(#soft)" transform="translate(100 90)">
    <rect x="20" y="0" width="700" height="380" rx="14" fill="#0c0914" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
    <rect x="40" y="20" width="660" height="340" rx="8" fill="url(#billboard)"/>
    <!-- subtle panels -->
    <rect x="40" y="20" width="220" height="340" fill="rgba(0,0,0,0.12)"/>
    <rect x="480" y="20" width="220" height="340" fill="rgba(255,255,255,0.06)"/>
    <text x="370" y="150" text-anchor="middle" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="58" font-weight="700">BDITEC</text>
    <rect x="250" y="180" width="240" height="4" rx="2" fill="#f8e937"/>
    <text x="370" y="230" text-anchor="middle" fill="#f8e937" font-family="Poppins, Arial, sans-serif" font-size="22" letter-spacing="4">PRINT · EVENT · OOH</text>
    <text x="370" y="275" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-family="Poppins, Arial, sans-serif" font-size="16">Marken sichtbar. Vor Ort. Messbar.</text>
    <!-- poles -->
    <rect x="180" y="380" width="22" height="170" fill="#1d1730"/>
    <rect x="538" y="380" width="22" height="170" fill="#1d1730"/>
    <rect x="120" y="540" width="500" height="16" rx="4" fill="#15101f"/>
    <rect x="100" y="556" width="540" height="10" rx="3" fill="#0c0914"/>
  </g>

  <!-- Flyer stack -->
  <g filter="url(#soft)" transform="translate(860 100)">
    <rect x="28" y="28" width="220" height="300" rx="12" fill="#26a4b0" opacity="0.75" transform="rotate(4 138 178)"/>
    <rect x="14" y="14" width="220" height="300" rx="12" fill="#5b2ef5" opacity="0.9" transform="rotate(2 124 164)"/>
    <rect width="220" height="300" rx="12" fill="url(#poster)"/>
    <rect x="24" y="28" width="172" height="18" rx="9" fill="#fff" opacity="0.9"/>
    <rect x="24" y="60" width="130" height="10" rx="5" fill="#fff" opacity="0.45"/>
    <rect x="24" y="90" width="172" height="110" rx="10" fill="rgba(0,0,0,0.18)"/>
    <circle cx="110" cy="145" r="34" fill="rgba(255,255,255,0.25)"/>
    <rect x="24" y="220" width="172" height="12" rx="6" fill="#fff" opacity="0.55"/>
    <rect x="24" y="246" width="120" height="10" rx="5" fill="#fff" opacity="0.3"/>
    <rect x="24" y="270" width="90" height="16" rx="8" fill="#f8e937"/>
  </g>

  <!-- Event badge + materials -->
  <g filter="url(#soft)" transform="translate(860 440)">
    <rect width="320" height="240" rx="18" fill="#171023" stroke="rgba(255,255,255,0.12)"/>
    <text x="24" y="40" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700">Production kit</text>
    <g transform="translate(24 64)">
      <rect width="88" height="64" rx="10" fill="rgba(91,46,245,0.35)" stroke="#5b2ef5"/>
      <text x="44" y="38" text-anchor="middle" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="12">Roll-up</text>
      <rect x="100" width="88" height="64" rx="10" fill="rgba(38,164,176,0.3)" stroke="#26a4b0"/>
      <text x="144" y="38" text-anchor="middle" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="12">Flyer</text>
      <rect x="200" width="88" height="64" rx="10" fill="rgba(255,1,143,0.28)" stroke="#ff018f"/>
      <text x="244" y="38" text-anchor="middle" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="12">Booth</text>
    </g>
    <rect x="24" y="150" width="272" height="1" fill="rgba(255,255,255,0.08)"/>
    <text x="24" y="184" fill="rgba(255,255,255,0.55)" font-family="Poppins, Arial, sans-serif" font-size="13">Druck · Montage · Event Setup</text>
    <rect x="24" y="200" width="150" height="28" rx="14" fill="#f8e937"/>
    <text x="99" y="219" text-anchor="middle" fill="#171023" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="700">Briefing ready</text>
  </g>

  <!-- Small outdoor sign -->
  <g filter="url(#soft)" transform="translate(100 620)">
    <rect width="280" height="90" rx="14" fill="#26a4b0"/>
    <text x="24" y="40" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="700">Direktwerbung</text>
    <text x="24" y="66" fill="rgba(255,255,255,0.85)" font-family="Poppins, Arial, sans-serif" font-size="13">Mailings · Displays · POS</text>
  </g>
</svg>
